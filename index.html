<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Recuperación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Formulario de Recuperación <small class="text-light">@clases.edu.sv</small></h3>
            </div>
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label for="ano" class="form-label">Año de Estudio</label>
                        <select class="form-select" name="ano" id="ano">
                            <option value="1">1°</option>
                            <option value="2">2°</option>
                            <option value="3">3°</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="especialidad" class="form-label">Especialidad</label>
                        <select class="form-select" name="especialidad" id="especialidad">
                            <option value="ds">Desarrollo de Software</option>
                            <option value="aps">Salud</option>
                            <option value="dg">Diseño Gráfico</option>
                            <option value="ac">Académico</option>
                            <option value="el">Sistemas Eléctricos</option>
                            <option value="co">Contabilidad</option>
                            <option value="bi">Bienestar Social</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="seccion" class="form-label">Sección</label>
                        <select class="form-select" name="seccion" id="seccion">
                            <option value="a">A</option>
                            <option value="b">B</option>
                            <option value="c">C</option>
                            <option value="d">D</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="nie" class="form-label">NIE</label>
                        <input type="number" class="form-control" name="nie" id="nie" placeholder="Ingrese su NIE">
                    </div>

                    <div class="mb-3">
                        <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" name="fecha_nacimiento" id="fecha_nacimiento">
                    </div>
                    <div class="mb-3">
                        <label for="numero_telefono" class="form-label">Número de Teléfono</label>
                        <input type="tel" class="form-control" name="numero_telefono" id="numero_telefono" placeholder="Ingrese su número de teléfono">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Enviar</button>
                </form>
            </div>
        </div>
    </div>

     <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
